<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta · loja no celular</title>
<!-- PROTÓTIPO para aprovação. Usa as cores, fontes e botões do site; só o que começa com "p-", "t", "g" e "m" é novo. -->
<link rel="stylesheet" href="../apps/web/src/styles/global.css">
<link rel="stylesheet" href="fontes.css">
<style>
  body { background: #FFFFFF; }
  .p-page { max-width: 560px; margin: 0 auto; padding-bottom: 32px; }
  .p-ic svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Vídeo colado no cabeçalho (sem o título repetido em cima) */
  .p-player { position: relative; aspect-ratio: 16 / 9; background: var(--ink); display: flex; align-items: center; justify-content: center; }
  .p-player button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--yellow); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(255, 206, 0, .18); }
  .p-player button svg { width: 28px; height: 28px; }
  .p-player small { position: absolute; left: 12px; bottom: 10px; color: #B8B8B8; font-size: 11px; }
  .p-viewers { background: var(--ink-2); color: #FFFFFF; padding: 0 16px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
  .p-viewers span, .p-viewers a { display: inline-flex; align-items: center; gap: 6px; }
  .p-viewers a { color: var(--yellow); font-weight: 700; text-decoration: none; min-height: 44px; }

  /* ---------- Termômetro novo ---------- */
  .t { margin: 16px 16px 0; border-radius: 20px; padding: 18px 16px 16px; }
  .t__top { display: flex; align-items: center; gap: 12px; }
  .t__num { font-family: var(--display); font-size: 60px; line-height: .95; font-variant-numeric: tabular-nums; }
  .t__lbl { flex: 1 1 0; min-width: 0; font-size: 13px; line-height: 1.25; }
  .t__lbl b { display: block; font-size: 16px; font-weight: 800; }
  .t__title { flex: 1 1 0; font-family: var(--display); font-size: 24px; line-height: 1.1; text-transform: uppercase; }
  .t__share { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
  .t__next { margin-top: 12px; font-size: 15px; line-height: 1.4; }
  .t__next b { font-weight: 800; }
  .t__track { display: flex; gap: 6px; margin-top: 12px; }
  .tseg { flex: 1 1 0; min-width: 0; }
  .tseg__bar { height: 12px; border-radius: 999px; overflow: hidden; }
  .tseg__fill { height: 100%; border-radius: 999px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .tseg__n { display: block; text-align: right; font-size: 11px; font-weight: 700; margin-top: 4px; }
  .t__goals { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .g { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border-radius: 14px; }
  .g__ic { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .g__ic svg { width: 18px; height: 18px; }
  .g__tx { flex: 1 1 0; min-width: 0; line-height: 1.25; }
  .g__tx b { display: block; font-size: 14px; font-weight: 800; }
  .g__tx span { font-size: 12px; }
  .g__st { font-size: 12px; font-weight: 800; white-space: nowrap; }
  .g__st--pill { font-size: 10px; letter-spacing: .06em; padding: 5px 9px; border-radius: 999px; }
  .t__note { margin-top: 12px; font-size: 12px; line-height: 1.45; }
  .g--novo { animation: g-novo 1.6s ease-out; }
  @keyframes g-novo { 0% { transform: scale(.96); box-shadow: 0 0 0 0 rgba(255, 206, 0, .9); } 40% { transform: scale(1.02); } 100% { transform: scale(1); box-shadow: 0 0 0 18px rgba(255, 206, 0, 0); } }
  @media (prefers-reduced-motion: reduce) { .g--novo { animation: none; } .tseg__fill, .tg__fill { transition: none; } }

  /* Opção A: cartão azul, trilha amarela */
  .t--a { background: var(--blue); color: #FFFFFF; }
  .t--a .t__num, .t--a .t__next .y { color: var(--yellow); }
  .t--a .t__lbl { color: var(--blue-text); }
  .t--a .t__lbl b { color: #FFFFFF; }
  .t--a .t__share { background: rgba(255, 255, 255, .16); color: #FFFFFF; }
  .t--a .tseg__bar { background: rgba(255, 255, 255, .22); }
  .t--a .tseg__fill { background: var(--yellow); }
  .t--a .tseg__n { color: var(--blue-text); }
  .t--a .tseg--ok .tseg__n { color: var(--yellow); }
  .t--a .g { background: rgba(255, 255, 255, .12); }
  .t--a .g__ic { border: 1.5px solid rgba(255, 255, 255, .5); }
  .t--a .g__tx span, .t--a .g__st { color: var(--blue-text); }
  .t--a .g--prox { background: #FFFFFF; color: var(--ink); }
  .t--a .g--prox .g__ic { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
  .t--a .g--prox .g__tx span { color: var(--text); }
  .t--a .g--prox .g__st { color: var(--blue-700); font-size: 13px; }
  .t--a .g--ok .g__ic { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
  .t--a .g--ok .g__st { background: var(--yellow); color: var(--ink); }
  .t--a .t__note { color: var(--blue-text); }

  /* Opção C: mesma trilha em tons de cinza (neutro) */
  .t--c { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .t--c .t__num { color: var(--blue); }
  .t--c .t__lbl { color: var(--muted); }
  .t--c .t__lbl b { color: var(--ink); }
  .t--c .t__next { color: var(--text); }
  .t--c .t__next b { color: var(--ink); }
  .t--c .t__next .y { color: var(--blue-700); }
  .t--c .t__share { background: #FFFFFF; color: var(--blue-700); border: 1.5px solid var(--line-2); }
  .t--c .tseg__bar { background: #D9DCE1; }
  .t--c .tseg__fill { background: var(--blue); }
  .t--c .tseg__n { color: var(--muted); }
  .t--c .tseg--ok .tseg__n { color: var(--blue-700); }
  .t--c .g { background: #FFFFFF; border: 1.5px solid var(--line); }
  .t--c .g__ic { background: var(--yellow-soft); border: 1.5px solid var(--yellow); color: var(--ink); }
  .t--c .g__tx span, .t--c .g__st { color: var(--muted); }
  .t--c .g--prox { border: 1.5px solid #A9C2F7; }
  .t--c .g--prox .g__ic { background: var(--yellow); color: var(--ink); }
  .t--c .g--prox { box-shadow: 0 0 0 4px var(--yellow-soft); }
  .t--c .g--prox .g__st { color: var(--blue-700); font-size: 13px; }
  .t--c .g--ok { background: var(--yellow-soft); border-color: var(--yellow); }
  .t--c .g--ok .g__ic { background: var(--yellow); color: var(--ink); }
  .t--c .g--ok .g__tx span { color: var(--text); }
  .t--c .g--ok .g__st { background: var(--yellow); color: var(--ink); }
  .t--c .t__note { color: var(--muted); }

  /* Opção B: cartão branco com o termômetro (bulbo e tubo) deitado */
  .t--b { background: #FFFFFF; color: var(--ink); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .t--b .t__share { background: var(--surface); color: var(--ink); }
  .t--b .t__next .y { color: var(--blue-700); }
  .tg { display: flex; align-items: center; margin-top: 30px; }
  .tg__bulb { width: 76px; height: 76px; border-radius: 50%; background: var(--blue); border: 3px solid var(--ink); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1; }
  .tg__bulb b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; }
  .tg__bulb small { font-size: 8px; font-weight: 700; letter-spacing: .1em; margin-top: 2px; }
  .tg__wrap { flex: 1 1 0; position: relative; margin-left: -12px; }
  .tg__tube { height: 30px; border: 3px solid var(--ink); border-left: 0; border-radius: 0 15px 15px 0; background: var(--surface); position: relative; overflow: hidden; }
  .tg__fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .tg__tick { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -3px; background: var(--ink); opacity: .28; }
  .tg__lab { position: absolute; top: -22px; transform: translateX(-100%); font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .tg__lab--ok { color: var(--green); }
  .t--b .g { background: var(--surface); }
  .t--b .g__ic { border: 1.5px solid var(--line-3); color: var(--muted); }
  .t--b .g__tx span, .t--b .g__st { color: var(--muted); }
  .t--b .g--prox { background: var(--blue-soft); color: var(--blue-700); }
  .t--b .g--prox .g__ic { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
  .t--b .g--prox .g__tx span, .t--b .g--prox .g__st { color: var(--blue-700); }
  .t--b .g--prox .g__st { font-size: 13px; }
  .t--b .g--ok { background: var(--green-soft); color: var(--green); }
  .t--b .g--ok .g__ic { background: var(--green); border-color: var(--green); color: #FFFFFF; }
  .t--b .g--ok .g__tx span { color: var(--green); }
  .t--b .g--ok .g__st { background: var(--green); color: #FFFFFF; }
  .t--b .t__note { color: var(--muted); }

  [hidden] { display: none !important; }

  /* Voucher em uma faixa só */
  .p-voucher { margin: 12px 16px 0; background: var(--yellow); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: var(--ink); }
  .p-voucher__v { flex-shrink: 0; display: flex; flex-direction: column; }
  .p-voucher__v small { font-size: 10px; font-weight: 700; letter-spacing: .12em; }
  .p-voucher__v b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; white-space: nowrap; }
  .p-voucher p { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .p-voucher a { color: var(--ink); font-weight: 700; }

  /* ---------- Motos ---------- */
  .p-head { margin: 32px 16px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .p-head h2 { font-size: 30px; line-height: 1.05; }
  .p-head span { font-size: 12px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .p-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 16px 4px; }
  .p-chips::-webkit-scrollbar { display: none; }
  .p-chips button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line-2); background: #FFFFFF; color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .p-chips button[aria-pressed='true'] { background: var(--ink); border-color: var(--ink); color: var(--yellow); }
  .p-list { margin: 8px 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .p-sub { margin: 28px 16px 0; }
  .p-sub h3 { font-size: 16px; font-weight: 800; color: var(--ink); }
  .p-sub p { font-size: 12.5px; line-height: 1.45; color: var(--text); margin-top: 2px; }

  /* Destaque: a moto que o apresentador acabou de anunciar */
  .d { border: 1.5px solid var(--line-2); border-radius: 18px; overflow: hidden; box-shadow: 4px 4px 0 var(--line-2); background: #FFFFFF; display: block; color: inherit; text-decoration: none; }
  .d__flag { background: var(--yellow); color: var(--ink); font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
  .d__flag i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
  .d img { display: block; width: 100%; height: 176px; object-fit: contain; border-bottom: 1px solid var(--line); }
  .d__body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .d__name { font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.2; }
  .d__price { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; background: var(--blue-soft); border-radius: 12px; padding: 10px 12px; }
  .d__price small { display: block; font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .d__price em { display: block; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--blue-700); margin-top: 2px; }
  .d__price b { display: block; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--blue); white-space: nowrap; }
  .d__tags { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 4px; }

  /* Liberada: cartão deitado, cabe 4 por tela */
  .m { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; border: 1.5px solid var(--line); border-radius: 16px; padding: 10px; background: #FFFFFF; color: inherit; text-decoration: none; min-height: 44px; }
  .m__img { position: relative; width: 104px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #FFFFFF; border: 1px solid var(--line); display: flex; align-items: center; }
  .m__img img { display: block; width: 100%; height: 100%; max-height: 104px; object-fit: contain; }
  .m__tx { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .m__k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .m__name { font-size: 15px; font-weight: 800; color: var(--ink); line-height: 1.25; }
  .m__from { font-size: 12px; color: var(--muted); }
  .m__from s { text-decoration: line-through; }
  .m__row { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .m__price { margin-top: auto; font-family: var(--display); font-size: 30px; line-height: 1.1; color: var(--blue); white-space: nowrap; }
  .m__cta { min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--blue); color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
  .m__cta--out { background: #FFFFFF; color: var(--ink); border: 2px solid var(--ink); padding: 0 10px; }
  .m__badge { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--green); }
  .m--off .m__img img { filter: grayscale(1); opacity: .55; }
  .m--off .m__price { color: var(--muted); }
  .m--off .m__badge { color: var(--ink); }

  /* Bloqueada: uma linha */
  .m--lock { flex-wrap: nowrap; align-items: center; padding: 8px 10px; }
  .m--lock .m__img { width: 72px; height: 60px; border: 0; }
  .m--lock .m__img::after { content: ''; position: absolute; inset: 0; background: rgba(27, 27, 27, .55); }
  .m--lock .m__lock { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; color: var(--yellow); }
  .m--lock .m__lock svg { width: 20px; height: 20px; }
  .m--lock .m__name { font-size: 14px; }
  .m__go { color: var(--line-3); display: flex; align-items: center; }
  .m__go svg { width: 18px; height: 18px; }

  .p-toast { position: fixed; left: 16px; right: 16px; top: 72px; z-index: 60; background: var(--ink); color: #FFFFFF; border-radius: 14px; padding: 12px 14px; font-size: 13px; font-weight: 600; line-height: 1.4; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
  .p-toast b { color: var(--yellow); }
  .p-toast span:first-child { width: 32px; height: 32px; border-radius: 50%; background: var(--yellow); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .p-toast svg { width: 16px; height: 16px; }
</style>
</head>
<body data-tela="proposta">
<header class="site-header site-header--sticky"><div class="site-header__inner">
  <div class="site-header__start"><span class="brand"><img class="brand__lle" src="../apps/web/public/brand/live-limpa-estoque-horizontal.png" alt="Live Limpa Estoque"></span></div>
  <div class="site-header__end"><span class="pill-live pill-live--on"><span class="pill-live__dot"></span>AO VIVO</span></div>
</div></header>

<main class="p-page">
  <div class="p-player"><button type="button" aria-label="Vídeo (exemplo)" id="play"></button><small>Aqui fica a transmissão do YouTube</small></div>
  <div class="p-viewers p-ic"><span id="olho"></span><a href="#" id="yt"></a></div>

  <div id="termo"></div>

  <div class="p-voucher">
    <div class="p-voucher__v"><small>VOUCHER</small><b id="voucher"></b></div>
    <p>Garante o preço da live e é abatido da entrada. <a href="#">Como funciona</a></p>
  </div>

  <div id="motos" class="p-head"><h2 class="display">Motos da live</h2><span id="conta"></span></div>
  <div class="p-chips" id="chips" role="group" aria-label="Filtrar motos"></div>
  <div class="p-list" id="liberadas"></div>
  <div class="p-sub" id="sub"><h3 id="subt"></h3><p>Liberadas uma a uma conforme o apresentador anuncia. Toque para ver fotos e ficha técnica.</p></div>
  <div class="p-list" id="bloqueadas"></div>
</main>

<div class="p-toast" id="toast" role="status" hidden></div>

<script src="dados.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let variante = new URLSearchParams(location.search).get('variante') || 'c';
let batidasAntes = null;

$('play').innerHTML = ICONE.play; $('voucher').textContent = DADOS.voucher;
$('olho').innerHTML = ICONE.eye + `<span><strong>${DADOS.assistindo.toLocaleString('pt-BR')}</strong> assistindo agora</span>`;
$('yt').innerHTML = 'Abrir no YouTube' + ICONE.ext;

function frase(p) {
  return p.proxima
    ? `Faltam <b class="y">${p.proxima.faltam}</b> para liberar <b>${p.proxima.brinde}</b> para todo mundo que comprou!`
    : `<b class="y">Todas as metas batidas!</b> Os brindes valem para todo mundo que comprou na live.`;
}

function metasHtml(p, novas) {
  return `<ol class="t__goals">${p.metas.map((g) => `
    <li class="g ${g.batida ? 'g--ok' : g.proxima ? 'g--prox' : ''} ${novas.includes(g.i) ? 'g--novo' : ''}">
      <span class="g__ic">${g.batida ? ICONE.check : ICONE.gift}</span>
      <span class="g__tx"><b>${g.brinde}</b><span>com ${g.motos} motos vendidas</span></span>
      ${g.batida ? '<span class="g__st g__st--pill">LIBERADO</span>' : `<span class="g__st">faltam ${g.faltam}</span>`}
    </li>`).join('')}</ol>`;
}

function termoHtml(p, novas) {
  const share = `<button type="button" class="t__share p-ic">${ICONE.share}Convidar</button>`;
  if (variante === 'b') {
    const n = p.metas.length;
    const pos = (f) => `calc(12px + (100% - 12px) * ${f})`;
    return `<section class="t t--b" aria-label="Termômetro de metas da live">
      <div class="t__top"><span class="t__title">Termômetro da live</span>${share}</div>
      <div class="tg" role="img" aria-label="${p.vendidas} motos vendidas">
        <div class="tg__bulb"><b>${p.vendidas}</b><small>VENDIDAS</small></div>
        <div class="tg__wrap">
          <div class="tg__tube"><div class="tg__fill" style="width:${pos(p.fill)}"></div>
            ${p.metas.slice(0, -1).map((g) => `<div class="tg__tick" style="left:${pos((g.i + 1) / n)}"></div>`).join('')}</div>
          ${p.metas.map((g) => `<span class="tg__lab ${g.batida ? 'tg__lab--ok' : ''}" style="left:${pos((g.i + 1) / n)}">${g.motos} motos</span>`).join('')}
        </div>
      </div>
      <p class="t__next">${frase(p)}</p>${metasHtml(p, novas)}</section>`;
  }
  return `<section class="t t--${variante === 'c' ? 'c' : 'a'}" aria-label="Termômetro de metas da live">
    <div class="t__top"><span class="t__num">${p.vendidas}</span>
      <span class="t__lbl"><b>${p.vendidas === 1 ? 'moto vendida' : 'motos vendidas'}</b>nesta live</span>${share}</div>
    <p class="t__next">${frase(p)}</p>
    <div class="t__track" aria-hidden="true">${p.metas.map((g) => `<div class="tseg ${g.batida ? 'tseg--ok' : ''}">
      <div class="tseg__bar"><div class="tseg__fill" style="width:${(g.parte * 100).toFixed(1)}%"></div></div><span class="tseg__n">${g.motos}</span></div>`).join('')}</div>
    ${metasHtml(p, novas)}</section>`;
}

function render(msg) {
  if (msg && msg.variante) variante = msg.variante;
  const p = progresso(DADOS.vendidas, DADOS.metas);
  const batidas = p.metas.filter((g) => g.batida).map((g) => g.i);
  const novas = batidasAntes ? batidas.filter((i) => !batidasAntes.includes(i)) : [];
  batidasAntes = batidas;
  $('termo').innerHTML = termoHtml(p, novas);
  if (novas.length) {
    const g = p.metas[novas[novas.length - 1]];
    $('toast').innerHTML = `<span>${ICONE.gift}</span><span><b>Meta batida!</b> ${g.brinde} liberado para todo mundo que comprar na live.</span>`;
    $('toast').hidden = false;
    clearTimeout(render.t);
    render.t = setTimeout(() => ($('toast').hidden = true), 4000);
  }
}

// Motos: a recém-anunciada em destaque, as liberadas em cartões deitados, as bloqueadas em linhas.
let filtro = 'Todas';
const tipos = ['Todas', 'Liberadas'];
function motos() {
  $('chips').innerHTML = tipos.map((t) => `<button type="button" aria-pressed="${t === filtro}">${t}</button>`).join('');
  const passa = (m) => filtro === 'Todas' || filtro === 'Liberadas' || m.tipo === filtro;
  const lib = DADOS.motos.filter((m) => m.estado !== 'bloqueada' && passa(m)).sort((a, b) => (b.disp > 0) - (a.disp > 0));
  const blo = filtro === 'Liberadas' ? [] : DADOS.motos.filter((m) => m.estado === 'bloqueada' && passa(m));
  $('conta').textContent = `${DADOS.motos.filter((m) => m.estado !== 'bloqueada').length} de ${DADOS.motos.length} liberadas`;
  $('liberadas').innerHTML = lib.map((m) => {
    const disp = m.disp > 1 ? m.disp + ' disponíveis' : m.disp === 1 ? 'Última unidade' : 'Esgotada';
    if (m.estado === 'agora') return `<a class="d" href="#"><div class="d__flag"><i></i>ANUNCIADA AGORA NA LIVE</div><img src="${m.foto}" alt="${m.nome}">
      <div class="d__body"><div><div class="kicker">${m.tipo} · 3 cores</div><div class="d__name">${m.nome}</div></div>
      <div class="d__price"><div><small>De ${brl(m.tabela)}</small><em>PREÇO NA LIVE</em><b>${brl(m.live)}</b></div>
        <div class="d__tags"><span class="badge badge--green">${disp}</span><span class="badge badge--green">Economia ${brl(m.tabela - m.live)}</span></div></div>
      <span class="btn btn--primary btn--block">Ver detalhes e reservar</span></div></a>`;
    return `<a class="m ${m.disp ? '' : 'm--off'}" href="#"><span class="m__img"><img src="${m.foto}" alt="${m.nome}" loading="lazy"></span>
      <span class="m__tx"><span class="m__badge">${disp}</span><span class="m__name">${m.nome}</span>
      <span class="m__from">De <s>${brl(m.tabela)}</s> · economia ${brl(m.tabela - m.live)}</span>
      <span class="m__price">${brl(m.live)}</span></span>
      <span class="btn ${m.disp ? 'btn--primary' : 'btn--outline'} btn--block">${m.disp ? 'Ver detalhes e reservar' : 'Ver detalhes e lista de espera'}</span></a>`;
  }).join('');
  $('sub').hidden = blo.length === 0;
  $('subt').textContent = `Em breve na live · ${blo.length}`;
  $('bloqueadas').innerHTML = blo.map((m) => `<a class="m m--lock" href="#"><span class="m__img"><img src="${m.foto}" alt="" loading="lazy"><span class="m__lock">${ICONE.lock}</span></span>
    <span class="m__tx"><span class="m__name">${m.nome}</span><span class="m__from">${m.tipo} · Tabela ${brl(m.tabela)}</span></span><span class="m__go">${ICONE.right}</span></a>`).join('');
}
$('chips').onclick = (e) => { const b = e.target.closest('button'); if (b) { filtro = b.textContent; motos(); } };
document.addEventListener('click', (e) => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });

ouvirVendas(render);
render();
motos();
</script>
</body>
</html>
